<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#0c1a40" />
      <stop offset="100%" stop-color="#070e22" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Atomic / Science ring -->
  <ellipse cx="50" cy="50" rx="36" ry="15" fill="none" stroke="url(#neonCyan)" stroke-width="3" transform="rotate(-30 50 50)" opacity="0.85" />
  <ellipse cx="50" cy="50" rx="36" ry="15" fill="none" stroke="url(#neonPurple)" stroke-width="3" transform="rotate(30 50 50)" opacity="0.85" />
  <!-- Science Flask / Book Core Motif -->
  <circle cx="50" cy="50" r="13" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="50" cy="50" r="6" fill="#38bdf8" />
  <circle cx="70" cy="38" r="3.5" fill="#a855f7" />
  <circle cx="30" cy="62" r="3.5" fill="#22d3ee" />
</svg>
